<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<!-- Google chặn ảnh Drive (lh3) nhúng kèm Referer khi tải nhiều ảnh liền nhau → không gửi Referer -->
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Find Tiles">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<title>Find Tiles</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%236b3fd4'/><path d='M8 8h7v7H8zM17 8h7v7h-7zM8 17h7v7H8zM17 17h7v7h-7z' fill='white'/></svg>">
<style>
:root{
  --bg:#fafafa; --panel:#fff; --text:#1d1d1f; --muted:#8a8a8e; --line:#ececee;
  --chip:#f1f1f3; --accent:#6b3fd4; --accent-soft:#efe9fd; --warn:#c2410c; --warn-soft:#fff1e8;
  --ok:#15803d; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.05);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}

/* ---------- Layout ---------- */
.app{display:flex;min-height:100%}
.side{width:250px;flex:none;background:var(--panel);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:16px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 20px;font-weight:600;font-size:17px}
.brand i{width:32px;height:32px;border-radius:8px;background:var(--accent);display:grid;place-items:center}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:8px;color:#55555a;text-align:left;width:100%}
.nav button:hover{background:var(--chip)}
.nav button.on{background:var(--chip);color:var(--text);font-weight:600}
.nav .n{margin-left:auto;font-size:12px;color:var(--muted);font-weight:400}
.btn{text-decoration:none;color:inherit;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-weight:500}
.btn:hover{background:var(--chip)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}

.main{flex:1;min-width:0;padding:16px 24px 48px}
.wrap{max-width:1180px;margin:0 auto}
.updated{text-align:center;color:var(--accent);font-size:12px;font-weight:600;letter-spacing:.02em;margin:16px 0;text-transform:uppercase}
.tools{display:flex;justify-content:flex-end;gap:8px;margin-bottom:20px;position:relative}
.search{position:relative;width:226px}
.search input{width:100%;padding:9px 34px 9px 34px;border:0;border-radius:8px;background:#efeff1;outline:none;-webkit-appearance:none;appearance:none}
.search input::-webkit-search-cancel-button{display:none}
.search .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;display:none;place-items:center;color:var(--muted)}
.search .clr:hover{background:#dcdce0;color:var(--text)}
.search.has .clr{display:grid}
.search input:focus{background:#e9e9ec;box-shadow:0 0 0 2px var(--accent-soft)}
.search > svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.fbtn{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:8px;background:#efeff1;color:#55555a;min-width:126px}
.fbtn .c{background:var(--accent);color:#fff;border-radius:9px;font-size:11px;padding:0 6px;font-weight:600}
.fbtn svg:last-child{margin-left:auto}
.fpanel{position:absolute;right:0;top:44px;z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.14);width:min(400px,calc(100vw - 32px));display:none;overflow:hidden}
.fpanel.open{display:flex;flex-direction:column;max-height:calc(100vh - 200px);max-height:calc(100dvh - 160px)}
.flist{overflow:auto;overscroll-behavior:contain;padding:4px 20px}
.fsec{border-bottom:1px solid var(--line)}
.fsec:last-child{border-bottom:0}
.fhead{display:flex;align-items:center;gap:10px;width:100%;padding:15px 0;font-size:16px;font-weight:600;text-align:left}
.fhead .sum{margin-left:auto;font-size:13px;font-weight:500;color:var(--accent);max-width:45%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fhead svg{flex:none;color:var(--muted);transition:transform .2s}
.fsec.open .fhead svg{transform:rotate(90deg)}
.fbody{display:none;padding:0 0 14px}
.fsec.open .fbody{display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 12px;border-radius:999px;background:var(--chip);font-size:13px}
.chip small{color:var(--muted);margin-left:4px}
.chip.on{background:var(--accent);color:#fff}
.chip.on small{color:rgba(255,255,255,.75)}
.ffoot{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--line)}
.ffoot .btn{flex:1;padding:11px;font-size:15px}
.link{color:var(--accent);font-weight:500}

/* ---------- Grid ---------- */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px 16px}
.card{text-align:left;display:block;width:100%;border-radius:8px;outline:none}
.card:focus-visible{box-shadow:0 0 0 2px var(--accent)}
.ph{position:relative;aspect-ratio:4/3;border-radius:6px;overflow:hidden;background:#e7e5e1}
.ph img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .25s,transform .3s}
.ph img.ld{opacity:1}
.card:hover .ph img{transform:scale(1.03)}
.badge{position:absolute;left:8px;top:8px;background:rgba(255,255,255,.92);color:var(--text);font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px}
.card h3{margin:8px 8px 0;font-size:14px;font-weight:600;letter-spacing:.01em}
.card p{margin:2px 8px 0;color:var(--muted);font-size:13px}
.stock{display:inline-flex;gap:4px;align-items:center;margin:4px 8px 0;font-size:12px;font-weight:600;color:var(--ok)}
.stock.low{color:var(--warn)}
.stock.zero{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:80px 0}
.sk .ph{animation:pulse 1.2s ease-in-out infinite}
.sk h3,.sk p{height:12px;background:#ececee;border-radius:4px;width:70%}
.sk p{width:40%;margin-top:6px}
@keyframes pulse{50%{opacity:.55}}

/* ---------- Modal ---------- */
.ov{position:fixed;inset:0;background:rgba(20,20,24,.45);z-index:50;display:none;align-items:center;justify-content:center;padding:24px}
.ov.open{display:flex}
.modal{background:var(--panel);border-radius:14px;max-width:920px;width:100%;max-height:calc(100vh - 48px);max-height:calc(100dvh - 48px);overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;box-shadow:0 20px 60px rgba(0,0,0,.25);position:relative}
.x{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;z-index:2;box-shadow:var(--shadow)}
.detail{display:grid;grid-template-columns:1.1fr 1fr}
.detail .img{background:#f3f2f0;padding:20px;display:flex;align-items:center;justify-content:center}
.detail .img a{display:block;line-height:0}
.detail .img img{max-width:100%;max-height:calc(100dvh - 88px);width:auto;height:auto;display:block;border-radius:10px;cursor:zoom-in}
.detail .info{padding:28px 28px 24px}
.detail h2{margin:0 0 2px;font-size:22px;text-align:center}
.detail .sub{color:var(--muted);margin-bottom:16px;text-align:center}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.kpi div{background:var(--accent-soft);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font-size:20px;color:var(--accent)}
.kpi span{font-size:12px;color:#6b6b70}
.kpi.one{grid-template-columns:1fr}
.card p.ln{color:var(--text);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.low div{background:var(--warn-soft)} .kpi.low b{color:var(--warn)}
.sh{margin:4px 0 12px;font-size:16px}
.specs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px;margin:0}
.specs dt{color:var(--muted);font-size:12.5px;margin-bottom:2px}
.specs dd{margin:0;font-size:14px;font-weight:500;overflow-wrap:anywhere}
.acts{display:flex;gap:8px;margin-top:18px}
.acts .btn{flex:1}


.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d1d1f;color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
.toast.show{opacity:1}

/* ---------- Responsive ---------- */
@media (max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:820px){
  .app{display:block}
  /* Thanh tab dưới đáy màn hình */
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:30;width:auto;height:auto;padding:6px 8px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
  .brand{display:none}
  .nav{flex-direction:row;gap:4px}
  .nav button{flex:1;flex-direction:column;gap:3px;padding:6px 4px;font-size:11.5px;color:var(--muted);background:none!important;border:1px solid transparent;border-radius:12px;white-space:nowrap}
  .nav button svg{width:24px;height:24px}
  .nav button.on{color:var(--accent);font-weight:600;background:var(--accent-soft)!important;border-color:#d8c9fb}
  .nav .n{display:none}
  .main{padding:4px 16px calc(84px + env(safe-area-inset-bottom))}
  .updated{margin:12px 0}
  .toast{bottom:calc(80px + env(safe-area-inset-bottom))}
  .tools{justify-content:stretch}
  .search{flex:1;width:auto;min-width:0}
  .search input{font-size:16px}   /* < 16px thì iPhone tự phóng to trang khi chạm vào ô */
  .fbtn{min-width:0;flex:none}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}
  .card h3{margin:6px 2px 0;font-size:13px} .card p,.stock{margin-left:2px}
  .ov{padding:0;align-items:flex-end}
  .modal{border-radius:0;max-width:none;height:100vh;height:100dvh;max-height:none}
  .x{position:sticky;top:10px;margin:10px 10px -44px auto}
  .acts{position:sticky;bottom:0;background:var(--panel);margin:14px -16px 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
  .detail{grid-template-columns:1fr}
  .detail .img{background:none;padding:56px 16px 0}
  .detail .img img{width:100%;max-height:none;border-radius:12px}
  .detail .info{padding:20px 16px 0}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><i><svg width="18" height="18" viewBox="0 0 32 32"><path d="M6 6h9v9H6zM17 6h9v9h-9zM6 17h9v9H6zM17 17h9v9h-9z" fill="#fff"/></svg></i>Find Tiles</div>
    <nav class="nav" id="nav"></nav>
    
  </aside>

  <main class="main">
    <div class="wrap">
      <div class="updated" id="updated">&nbsp;</div>
      <div class="tools">
        <label class="search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="Tìm kiếm" autocomplete="off" enterkeyhint="search">
          <button type="button" class="clr" id="qclr" aria-label="Xoá tìm kiếm"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        </label>
        <button class="fbtn" id="fbtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M7 12h10M10 18h4"/></svg>
          Lọc <span class="c" id="fcount" hidden></span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="fpanel" id="fpanel"></div>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </main>
</div>

<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ===== Cấu hình: dán URL web app Apps Script vào đây ===== */
const API_URL = 'https://script.google.com/macros/s/AKfycbxAoqYvNwfN0c-1ZG8C0gKWRjmJOuhuOcDkKsBzvb4dx2jW2_QLnNLzYXUoxVoWlPmhgA/exec';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const img = (id, w) => id ? `https://lh3.googleusercontent.com/d/${id}=w${w}` : '';
const fmt = n => n == null ? '–' : n.toLocaleString('vi-VN', {maximumFractionDigits: 1});
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};

const dec = v => String(v).replace('.', ',');
const sizeFmt = v => v.replace(/x/gi, '×');
const ICONS = {   // Sàn: ván so le; Tấm ốp tường, Phụ kiện: Tabler layout-board, puzzle
  san: '<path d="M4 4h16v16H4zM4 9.3h16M4 14.6h16M9 4v5.3M15 9.3v5.3M9 14.6V20"/>',
  tuong: '<path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M4 9h8M12 15h8M12 4v16"/>',
  pk: '<path d="M4 7h3a1 1 0 0 0 1-1V5a2 2 0 0 1 4 0v1a1 1 0 0 0 1 1h3a1 1 0 0 1 1 1v3a1 1 0 0 0 1 1h1a2 2 0 0 1 0 4h-1a1 1 0 0 0-1 1v3a1 1 0 0 1-1 1h-3a1 1 0 0 1-1-1v-1a2 2 0 0 0-4 0v1a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a2 2 0 0 0 0-4H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1"/>',
};
// Cấu hình hiển thị từng mục: bộ lọc, thông tin chi tiết, cách ghi tồn kho
const VIEW = {
  san: {
    badge: 'line',
    sub: it => [it.line, it.brand],
    filters: [['line', 'Dòng sản phẩm'], ['brand', 'Nhãn'], ['colorGroup', 'Màu'], ['pattern', 'Kiểu lát'], ['size', 'Kích thước'], ['thickness', 'Độ dày tấm']],
    // đúng danh sách & thứ tự như bản Glide
    specs: [
      ['line', 'Dòng sản phẩm'], ['pattern', 'Kiểu lát'], ['color', 'Màu sắc'],
      ['size', 'Kích thước', sizeFmt], ['thickness', 'Độ dày tấm', dec], ['layer', 'Độ dày Layer', dec],
      ['emboss', 'Vân trùng khớp'], ['lock', 'Loại hèm khóa'], ['edgePaint', 'Sơn mép'], ['underlay', 'Loại tấm đế'],
      ['piecesPerBox', 'Tiêu chuẩn đóng hộp'], ['m2PerBox', 'Quy cách m2/hộp', dec], ['weight', 'Trọng lượng Hộp', v => dec(v) + ' ±1 Kg'],
    ],
  },
  tuong: {
    badge: 'design',
    sub: it => [it.brand],
    filters: [['brand', 'Nhãn'], ['design', 'Thiết kế'], ['colorGroup', 'Màu'], ['surface', 'Bề mặt'], ['size', 'Kích thước']],
    specs: [
      ['surface', 'Bề mặt'], ['film', 'Film'], ['coreColor', 'Màu xương'], ['core', 'Loại xương'],
      ['size', 'Kích thước', sizeFmt], ['lock', 'Hèm'], ['brand', 'Nhãn'], ['label', 'Tem đầu hộp'],
      ['thickness', 'Tổng độ dày'], ['design', 'Thiết kế'], ['colorGroup', 'Màu'],
      ['packing', 'Quy cách đóng gói'], ['m2PerBox', 'Diện tích/hộp'],
    ],
  },
  pk: {
    sub: it => [it.line],
    filters: [['line', 'Dòng sản phẩm'], ['size', 'Kích thước']],
    specs: [['line', 'Dòng sản phẩm'], ['size', 'Kích thước', sizeFmt], ['unit', 'Đơn vị tính']],
  },
};

const S = {
  data: store.get('ft:data2'),
  sec: store.get('ft:sec') || 'san',
  q: '',
  f: {},
  sort: 'default',
  fopen: null,
};
const cur = () => S.data?.sections.find(x => x.id === S.sec) || S.data?.sections[0];
const view = () => VIEW[cur()?.id] || VIEW.san;
const unitOf = (sec, it) => (it.unit || sec.unit || 'hộp').toLowerCase();

/* ---------- API ---------- */
async function api(tries = 3) {
  for (let i = 1; ; i++) {
    try {
      const r = await fetch(API_URL);
      const j = await r.json();          // Apps Script thỉnh thoảng trả trang lỗi HTML → json() ném lỗi → thử lại
      if (j.error || !j.sections) throw new Error(j.error || 'Dữ liệu không đúng định dạng');
      return j;
    } catch (e) {
      if (i >= tries) throw e;
      await new Promise(ok => setTimeout(ok, 800 * i));
    }
  }
}
async function load() {
  try {
    const d = await api();
    S.data = d; store.set('ft:data2', d);
    render();
  } catch (e) {
    if (!S.data) $('#grid').innerHTML = `<div class="empty" style="grid-column:1/-1">Không tải được dữ liệu.<br><small>${esc(e.message)}</small></div>`;
    else toast('Đang xem dữ liệu đã lưu — mất kết nối');
  }
}

/* ---------- Lọc ---------- */
function list() {
  const sec = cur();
  if (!sec) return [];
  const q = S.q.trim().toLowerCase();
  let a = sec.items.filter(it =>
    view().filters.every(([k]) => !S.f[k]?.length || S.f[k].includes(it[k])) &&
    (!q || [it.code, it.line, it.color, it.colorGroup, it.brand, it.size, it.design].join(' ').toLowerCase().includes(q))
  );
  if (S.sort === 'stock') a = a.slice().sort((x, y) => (y.stockM2 ?? y.stockBox ?? -1) - (x.stockM2 ?? x.stockBox ?? -1));
  if (S.sort === 'code') a = a.slice().sort((x, y) => x.code.localeCompare(y.code));
  return a;
}

/* ---------- Render ---------- */
function render() {
  const secs = S.data?.sections || [];
  if (secs.length && !secs.some(x => x.id === S.sec)) S.sec = secs[0].id;
  $('#nav').innerHTML = secs.map(x =>
    `<button class="${x.id === S.sec ? 'on' : ''}" data-cat="${esc(x.id)}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICONS[x.id] || ICONS.san}</svg>${esc(x.title)}<span class="n">${x.items.length}</span></button>`).join('');
  const sec = cur();
  document.title = sec?.title ? sec.title + ' · Find Tiles' : 'Find Tiles';
  $('#updated').textContent = sec?.updated ? `Tồn kho cập nhật đến ngày ${sec.updated}` : ' ';
  renderFilters();
  renderGrid();
}

function stockText(sec, it) {
  if (it.stockBox == null) return '';
  const low = sec.lowStock || 20;
  const cls = it.stockBox <= 0 ? 'zero' : it.stockBox < low ? 'low' : '';
  const txt = it.stockBox <= 0 ? 'Hết hàng'
    : `${fmt(it.stockBox)} ${unitOf(sec, it)}` + (it.stockM2 != null ? ` · ${fmt(it.stockM2)} m²` : '');
  return `<div class="stock ${cls}">${txt}</div>`;
}

function renderGrid() {
  const sec = cur();
  if (!sec) {
    $('#grid').innerHTML = Array(8).fill('<div class="card sk"><div class="ph"></div><h3></h3><p></p></div>').join('');
    return;
  }
  if (sec.error) {
    $('#grid').innerHTML = `<div class="empty" style="grid-column:1/-1">Không đọc được dữ liệu ${esc(sec.title)}.<br><small>${esc(sec.error)}</small></div>`;
    return;
  }
  const a = list(), badge = view().badge;
  $('#grid').innerHTML = a.length ? a.map((it, i) => `<button class="card" data-code="${esc(it.code)}">
      <div class="ph">${it.image ? `<img src="${img(it.image, 600)}" loading="${i < 8 ? 'eager' : 'lazy'}" alt="${esc(it.code)}" onload="this.classList.add('ld')">` : ''}
        ${badge && it[badge] ? `<span class="badge">${esc(it[badge])}</span>` : ''}</div>
      <h3>${esc(it.code)}</h3>${sec.id === 'pk' && it.line ? `<p class="ln">${esc(it.line)}</p>` : ''}<p>${esc(sizeFmt(it.size || ''))}</p>${stockText(sec, it)}</button>`
  ).join('') : '<div class="empty" style="grid-column:1/-1">Không có mã nào khớp.</div>';
}

function renderFilters() {
  const items = cur()?.items || [];
  const filters = view().filters;
  const opts = k => {
    const c = {};
    items.forEach(it => { if (it[k]) c[it[k]] = (c[it[k]] || 0) + 1; });
    return Object.keys(c).sort((a, b) => a.localeCompare(b, 'vi', {numeric: true})).map(v => [v, c[v]]);
  };
  const n = filters.reduce((s, [k]) => s + (S.f[k]?.length || 0), 0);
  $('#fcount').hidden = !n; $('#fcount').textContent = n;
  const chev = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m9 6 6 6-6 6"/></svg>';
  const block = (key, label, sum, body) =>
    `<div class="fsec ${S.fopen === key ? 'open' : ''}"><button class="fhead" data-fopen="${key}">${label}<span class="sum">${esc(sum)}</span>${chev}</button><div class="fbody">${body}</div></div>`;
  const groups = filters.map(([k, label]) => {
    const o = opts(k);
    if (o.length < 2) return '';
    return block(k, label, (S.f[k] || []).join(', '), `<div class="chips">${o.map(([v, c]) =>
      `<button class="chip ${S.f[k]?.includes(v) ? 'on' : ''}" data-fk="${k}" data-fv="${esc(v)}">${esc(v)}<small>${c}</small></button>`).join('')}</div>`);
  }).join('');
  const SORTS = [['default', 'Mặc định'], ['code', 'Theo mã'], ['stock', 'Tồn nhiều nhất']];
  const sort = block('sort', 'Sắp xếp', S.sort === 'default' ? '' : SORTS.find(x => x[0] === S.sort)[1],
    `<div class="chips">${SORTS.map(([v, l]) => `<button class="chip ${S.sort === v ? 'on' : ''}" data-sort="${v}">${l}</button>`).join('')}</div>`);
  $('#fpanel').innerHTML = `<div class="flist">${groups}${sort}</div>
    <div class="ffoot"><button class="btn" id="fclear">Xoá tất cả</button><button class="btn primary" id="fdone">Xong</button></div>`;
}

function openDetail(code) {
  const sec = cur();
  const it = sec?.items.find(x => x.code === code);
  if (!it) return;
  const low = sec.lowStock || 20;
  const stock = it.stockBox != null ? `<div class="kpi ${it.stockBox < low ? 'low' : ''} ${it.stockM2 == null ? 'one' : ''}">
        <div><b>${fmt(it.stockBox)}</b><span>${unitOf(sec, it)} tồn kho</span></div>
        ${it.stockM2 != null ? `<div><b>${fmt(it.stockM2)}</b><span>m² tồn kho</span></div>` : ''}</div>` : '';
  const rows = view().specs.filter(([k]) => it[k]).map(([k, l, f]) => `<div><dt>${l}</dt><dd>${esc(f ? f(it[k]) : it[k])}</dd></div>`).join('');
  $('#modal').innerHTML = `<button class="x" data-act="close" aria-label="Đóng"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div class="detail"><div class="img">${it.image ? `<a href="${img(it.image, 3000)}" target="_blank" rel="noopener" title="Xem ảnh gốc"><img src="${img(it.image, 600)}" alt="" onload="if(!this.dataset.hd){this.dataset.hd=1;const h=new Image();h.onload=()=>this.src=h.src;h.src='${img(it.image, 1400)}'}"></a>` : ''}</div>
    <div class="info"><h2>${esc(it.code)}</h2><div class="sub">${esc(view().sub(it).filter(Boolean).join(' · '))}</div>
    ${stock}<h3 class="sh">Thông tin sản phẩm</h3><dl class="specs">${rows}</dl>
    <div class="acts"><button class="btn primary" data-act="copy" data-code="${esc(it.code)}">Copy mã</button>
    ${it.folder ? `<a class="btn" href="${esc(it.folder)}" target="_blank" rel="noopener">Thư mục ảnh ↗</a>` : ''}</div></div></div>`;
  show();
}

function show() { $('#ov').classList.add('open'); document.body.style.overflow = 'hidden'; }
function hide() { $('#ov').classList.remove('open'); document.body.style.overflow = ''; $('#modal').style.maxWidth = ''; }
let tt; function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2200); }

/* ---------- Sự kiện ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button,a');
  const fp = $('#fpanel');
  if (fp.classList.contains('open') && !e.target.closest('#fpanel,#fbtn')) fp.classList.remove('open');
  if (e.target === $('#ov')) return hide();
  if (!t) return;
  if (t.dataset.cat) { S.sec = t.dataset.cat; S.f = {}; S.fopen = null; S.sort = 'default'; store.set('ft:sec', S.sec); render(); scrollTo(0, 0); }
  else if (t.id === 'fbtn') fp.classList.toggle('open');
  else if (t.dataset.fk) {
    const k = t.dataset.fk, v = t.dataset.fv, cur = S.f[k] || [];
    S.f[k] = cur.includes(v) ? cur.filter(x => x !== v) : [...cur, v];
    renderFilters(); renderGrid();
  }
  else if (t.dataset.fopen) { S.fopen = S.fopen === t.dataset.fopen ? null : t.dataset.fopen; renderFilters(); }
  else if (t.dataset.sort) { S.sort = t.dataset.sort; renderFilters(); renderGrid(); }
  else if (t.id === 'fclear') { S.f = {}; S.sort = 'default'; renderFilters(); renderGrid(); }
  else if (t.id === 'fdone') fp.classList.remove('open');
  else if (t.dataset.code && t.classList.contains('card')) openDetail(t.dataset.code);
  else if (t.dataset.act === 'close') hide();
  else if (t.dataset.act === 'copy') navigator.clipboard?.writeText(t.dataset.code).then(() => toast('Đã copy ' + t.dataset.code));
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { hide(); $('#fpanel').classList.remove('open'); } });
let qt; $('#q').addEventListener('input', e => {
  $('.search').classList.toggle('has', !!e.target.value);
  clearTimeout(qt); qt = setTimeout(() => { S.q = e.target.value; renderGrid(); }, 120);
});
$('#qclr').addEventListener('click', e => {
  e.preventDefault();
  $('#q').value = ''; $('.search').classList.remove('has');
  S.q = ''; renderGrid(); $('#q').focus();
});
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });   // bấm "Tìm" trên bàn phím điện thoại thì ẩn bàn phím

render();   // hiện ngay dữ liệu đã lưu lần trước (nếu có)
load();     // rồi tải bản mới
</script>
</body>
</html>
